[package]
name = "cyber_kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cyber Universe OS kernel"

[dependencies]
limine = "=0.5.0"

[features]
# Test build: the kernel waits for a byte on COM1, then exits QEMU through isa-debug-exit.
qemu-test = []
# Test scenarios (tests/scenarios.txt). Each one deliberately triggers a situation and checks the kernel's reaction.
test-panic = ["qemu-test"]
test-divzero = ["qemu-test"]
test-pagefault = ["qemu-test"]
test-doublefault = ["qemu-test"]
test-unmapped = ["qemu-test"]
test-keyboard = ["qemu-test"]
# P2-09: the shell runs the commands typed by the test harness.
test-shell = ["qemu-test"]
# P2-10: the build carries the FAT32 test disk (disk.img) and the kernel checks it.
test-disk = ["qemu-test"]
# P3-02: /disk must come from the SATA disk through the AHCI driver.
test-ahci = ["qemu-test"]
# P3-03: /disk must come from the NVMe disk.
test-nvme = ["qemu-test"]
# P3-04: the build also makes a USB stick image; the kernel must have been started from it (a disk).
test-usb = ["qemu-test"]
# P3-07: the test disk is attached as a USB stick and must be readable at /usb.
test-usbdisk = ["qemu-test"]
# P3-08: ARP request through the network card, answer from QEMU's virtual gateway.
test-net = ["qemu-test"]
# P4-01: the harness moves the mouse and clicks; the kernel must receive both events.
test-mouse = ["qemu-test"]
# P4-04: two windows; the harness types keys and drags the top one by its title bar with the mouse.
test-windows = ["qemu-test"]
# P4-05: /bin/demo opens a window through system calls; the harness clicks in it and types q.
test-appwindow = ["qemu-test"]
# P4-06: the desktop: bar, clock, Start menu (clicked by the harness), a program started from the menu.
test-desktop = ["qemu-test"]
# P4-07: writing on a copy of the test disk marked for writing (the harness checks it with fsck.fat).
test-fatwrite = ["qemu-test"]
# P4-08: module manager on a copy of the test disk marked for writing; then `mod list` in the shell.
test-modules = ["qemu-test"]
# P4-09: system monitor and file manager driven with simulated clicks and keys.
test-sysapps = ["qemu-test"]
# P4-10: text editor (keys typed by QEMU), settings, opening a text file from the file manager.
test-editor = ["qemu-test"]
# P1-13: a write to .rodata must fault (the kernel image keeps its per-segment rights).
test-rodata = ["qemu-test"]
# Stability test (P1-11): 5 minutes; the quick variant runs the same loop for 15 seconds.
test-stress = ["qemu-test"]
test-stress-quick = ["test-stress"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = 1
