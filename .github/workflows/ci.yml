name: CI

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unelte sistem (QEMU, OVMF, xorriso, unelte FAT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf xorriso dosfstools mtools fdisk

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal -c rust-src -t x86_64-unknown-none

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/target-test*
            build/limine-*
          key: ${{ runner.os }}-cu-${{ hashFiles('kernel/Cargo.toml', 'kernel/Cargo.lock', 'kernel/rust-toolchain.toml') }}

      - name: Verificare mediu
        run: tools/env-check.sh

      - name: Criptografie — vectorii oficiali pe gazdă (crypto/)
        run: cd crypto && cargo test --release

      - name: TLS 1.3 — clientul nostru față de un server OpenSSL pe gazdă și față de site-uri reale (tls/)
        run: cd tls && CYBER_NET=1 cargo test --release -- --nocapture

      - name: JSON — cititorul și scriitorul propriu, față de Python (json/)
        run: cd json && cargo test --release

      - name: Driver Realtek RTL8168 — față de modelul cipului, pe gazdă (rtl8168/)
        run: cd rtl8168 && cargo test --release

      - name: Build + test în QEMU (cu scenariile care au nevoie de internet)
        run: CYBER_NET=1 tools/test.sh

      - name: Imagine pentru stick USB (docs/USB.md)
        run: tools/build.sh --usb

      - name: Imaginea pentru stick
        uses: actions/upload-artifact@v4
        with:
          name: stick-usb
          path: build/cyber-universe-usb.img
          if-no-files-found: error

      - name: Fișierele pentru Release (P6-07)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tools/release-files.sh

      - name: Fișierele pentru Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/
          if-no-files-found: error

      - name: Rezultate (log serial și captură de ecran)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezultate-test
          path: |
            build/serial-*.log
            build/build-*.log
            tests/screens/*.png
          if-no-files-found: ignore

  # P6-07: after green tests on main, a GitHub Release with the stick files (the newest is "latest"); the last 5 are kept.
  # Only this job may write to the repository.
  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Release os-<număr> (marcat „latest”), păstrează ultimele 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="os-${{ github.run_number }}"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
            --title "Cyber Universe OS $TAG" \
            --notes "Construit și testat de CI din commit-ul $GITHUB_SHA. Fișierele pentru stick: docs/USB.md (varianta B). Sumele: SHA256SUMS."
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^os-' | tail -n +6 | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
