name: CI

# C-15: no run for commits that only touch documents (STATE.md, docs/, screenshots); a newer run on the same branch
# cancels the older one. Release only comes from a push with code changes (documents never start a run).
on:
  push:
    branches: [main, "wip/**"]
    paths-ignore: ["docs/**", "**/*.md", "tests/screens/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "tests/screens/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P6-67: three parts running at the same time (one run took 54m51s of the 60-minute limit with all scenarios in one job):
  # teste-1 / teste-2 = every other QEMU scenario (tools/test.sh --shard), stick = host tests + stick images + Release files.
  build-and-test:
    name: ${{ matrix.parte }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - parte: teste-1
            shard: 1/2
          - parte: teste-2
            shard: 2/2
          - parte: stick
            shard: ""
    steps:
      # C-37: no stored github.token header, otherwise git sends it instead of CYBER_GPU_TOKEN for cyber-gpu.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Spațiu pe disc (uneltele mari ale mașinii GitHub, nefolosite aici)
        # 2026-11-07: run 42391129170 had 97/97 scenarios green, then ran out of disk (93 MB left) building the stick image:
        # the cache restored the previous cyber-gpu revision's build files next to the new ones.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Unelte sistem (QEMU, OVMF, xorriso, unelte FAT)
        # Fail fast instead of hanging for an hour when the package mirrors stall (CI 284, 11 Nov 2026).
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            timeout 150 sudo -E apt-get update $APT_OPTS && \
            timeout 300 sudo -E apt-get install -y -qq $APT_OPTS \
              qemu-system-x86 ovmf xorriso dosfstools mtools fdisk && exit 0
            # CI 284/285: `apt-get update` hung even with a second Ubuntu mirror, so keep only the Ubuntu sources
            # (the runner's extra repositories are not needed here) and use the kernel.org mirror.
            echo "apt attempt $i failed; only Ubuntu sources from the kernel.org mirror, retrying in 15 s"
            sudo mkdir -p /etc/apt/oprite
            for f in /etc/apt/sources.list.d/*; do
              [ "$(basename "$f")" = ubuntu.sources ] || sudo mv "$f" /etc/apt/oprite/ 2>/dev/null || true
            done
            sudo sed -i -E 's#https?://([a-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            ls /etc/apt/sources.list.d/; grep -h '^URIs' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 15
          done
          exit 1

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal -c rust-src -t x86_64-unknown-none

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/target-test*
            build/limine-*
            crypto/target
            tls/target
            json/target
            rtl8168/target
            e1000e/target
          key: ${{ runner.os }}-cu2-${{ matrix.parte }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cu2-${{ matrix.parte }}-
            ${{ runner.os }}-cu2-

      - name: Verificare mediu
        run: tools/env-check.sh

      - name: Criptografie — vectorii oficiali pe gazdă (crypto/)
        if: matrix.parte == 'stick'
        run: cd crypto && cargo test --release

      - name: TLS 1.3 — clientul nostru față de un server OpenSSL pe gazdă și față de site-uri reale (tls/)
        if: matrix.parte == 'stick'
        run: cd tls && CYBER_NET=1 cargo test --release -- --nocapture

      - name: JSON — cititorul și scriitorul propriu, față de Python (json/)
        if: matrix.parte == 'stick'
        run: cd json && cargo test --release

      - name: Driver Realtek RTL8168 — față de modelul cipului, pe gazdă (rtl8168/)
        if: matrix.parte == 'stick'
        run: cd rtl8168 && cargo test --release
      - name: Driver Intel e1000/82574/I219 — față de modelul plăcii, pe gazdă (e1000e/)
        if: matrix.parte == 'stick'
        run: cd e1000e && cargo test --release

      - name: Acces la cyber-gpu (repo privat, B-005)
        env:
          CYBER_GPU_TOKEN: ${{ secrets.CYBER_GPU_TOKEN }}
        run: tools/ci-cyber-gpu-acces.sh

      - name: Build + test în QEMU, partea ${{ matrix.shard }} (cu scenariile care au nevoie de internet)
        if: matrix.shard != ''
        run: CYBER_NET=1 tools/test.sh --shard ${{ matrix.shard }}

      - name: Imagine pentru stick USB (docs/USB.md)
        if: matrix.parte == 'stick'
        run: tools/build.sh --usb

      # P6-40 (C-52): the test stick of the I6 window (`gpu i6 --scrie`), a separate kernel and image in the Release.
      - name: Stick-ul de test pentru fereastra I6 (gpu-scrie)
        if: matrix.parte == 'stick'
        run: tools/build.sh --gpu-scrie --usb

      - name: Imaginea pentru stick
        if: matrix.parte == 'stick'
        uses: actions/upload-artifact@v4
        with:
          name: stick-usb
          path: build/cyber-universe-usb.img
          if-no-files-found: error

      - name: Fișierele pentru Release (P6-07)
        if: matrix.parte == 'stick' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tools/release-files.sh

      - name: Fișierele pentru Release
        if: matrix.parte == 'stick' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/
          if-no-files-found: error

      - name: Rezultate (log serial și captură de ecran)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezultate-test-${{ matrix.parte }}
          path: |
            build/serial-*.log
            build/build-*.log
            tests/screens/*.png
          if-no-files-found: ignore

  # P6-07: after green tests on main, a GitHub Release with the stick files (the newest is "latest"); the last 5 are kept.
  # Only this job may write to the repository.
  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # C-17: the list of kept Releases (hardware-tested or restore points) lives in docs/RELEASES_PASTRATE.md.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/RELEASES_PASTRATE.md
          sparse-checkout-cone-mode: false
          path: repo
      # C-16: os-187 = the restore point chosen by Adrian (stabil-2026-10-23: 9f67d7b + a test-only fix) is never deleted.
      - name: Release os-<număr> (marcat „latest”), păstrează ultimele 5 + cele din RELEASES_PASTRATE.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="os-${{ github.run_number }}"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
            --title "Cyber Universe OS $TAG" \
            --notes "Construit și testat de CI din commit-ul $GITHUB_SHA. Fișierele pentru stick: docs/USB.md (varianta B). Sumele: SHA256SUMS."
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^os-' | grep -vxF -e os-187 -f <(grep -oE '^\| *os-[0-9]+ *\|' repo/docs/RELEASES_PASTRATE.md | tr -d '| ') \
            | tail -n +6 | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
