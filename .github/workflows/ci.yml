name: CI

# C-15: no run for commits that only touch documents (STATE.md, docs/, screenshots); a newer run on the same branch
# cancels the older one. Release only comes from a push with code changes (documents never start a run).
on:
  push:
    branches: [main, "wip/**"]
    paths-ignore: ["docs/**", "**/*.md", "tests/screens/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "tests/screens/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P6-67: three parts running at the same time (one run took 54m51s of the 60-minute limit with all scenarios in one job):
  # teste-1 / teste-2 = every other QEMU scenario (tools/test.sh --shard), stick = host tests + stick images + Release files.
  # P6-131: four parts (teste-1..3 = every third scenario): run 44984928816 (os-345) hit the 60-minute limit in teste-1
  # (each of the two QEMU parts took ~50 min after 130+ scenarios).
  # P6-138: five parts (teste-1..4 = every fourth scenario): os-352's QEMU parts took 50 / 50 / 54 min of the 60.
  # P6-156: six parts (teste-1..5), split by the measured duration of each scenario (tools/shard.py, tests/durate-ci.txt):
  # run 45114337749 (os-366 + P6-153/154) took 50 / 41 / 37 / 41 min with every fourth scenario; balanced: ~34 min each.
  # P6-167: seven parts (teste-1..6): with the mixed step the five QEMU parts reached ~51 of the 60 minutes.
  # P6-176: eight parts (teste-1..7): with `antrenare-mini-placa-mixt-lipit` the table gave ~57 min per part out of 6.
  # P6-189: nine QEMU parts (teste-1..9): with `kronos-gpu-antrenare-513-colsum` the table gave ~59 min per part out of 8.
  # P6-190: ten QEMU parts (teste-1..10): with `kronos-gpu-antrenare-513-cursa` the table gave ~57 min per part out of 9.
  # P6-192: eleven QEMU parts (teste-1..11): with `kronos-gpu-antrenare-513-tablou` the table gave ~55.4 min per part out of 10.
  # P6-195: twelve QEMU parts (teste-1..12): with `kronos-gpu-antrenare-513-proba64` the table gave ~55.6 min per part out of 11.
  # P6-197: thirteen QEMU parts (teste-1..13): with `kronos-gpu-mm-tc128` the table gave ~53.9 min per part out of 12.
  # P6-198: fourteen QEMU parts (teste-1..14): with `kronos-gpu-antrenare-513-mixt` the table gave ~52 min per part out of 13.
  # P6-234: seventeen QEMU parts (teste-1..17): run 45828216361 (os-465) had teste-2 at 59m43s of the 60 with 16 parts;
  # with `kronos-gpu-atentie-tc0` the table gives ~59.7 min per part out of 17 (63.5 out of 16).
  # P6-235: eighteen QEMU parts (teste-1..18): with `kronos-gpu-atentie-tc0-v4` the table gives ~60.7 min out of 17, ~57.3 out of 18.
  # P6-237: nineteen QEMU parts (teste-1..19): with `kronos-gpu-antrenare-513-atentie-v4` the table gives ~59.0 min out of 18, ~55.9 out of 19.
  # P6-241: twenty QEMU parts (teste-1..20): with `kronos-gpu-antrenare-513-atentie-ds` the table gives ~57.8 min out of 19, ~54.9 out of 20.
  # P6-245: twenty-one QEMU parts (teste-1..21): with `kronos-gpu-antrenare-513-v5` the table gives ~57.2 min out of 20, ~54.6 out of 21.
  # P6-247: twenty-two QEMU parts (teste-1..22): with `kronos-gpu-mm-tc-v6-dxdw` and `kronos-gpu-antrenare-513-v6` the table gives ~57.4 min out of 21, ~54.7 out of 22.
  build-and-test:
    name: ${{ matrix.parte }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - parte: teste-1
            shard: 1/22
          - parte: teste-2
            shard: 2/22
          - parte: teste-3
            shard: 3/22
          - parte: teste-4
            shard: 4/22
          - parte: teste-5
            shard: 5/22
          - parte: teste-6
            shard: 6/22
          - parte: teste-7
            shard: 7/22
          - parte: teste-8
            shard: 8/22
          - parte: teste-9
            shard: 9/22
          - parte: teste-10
            shard: 10/22
          - parte: teste-11
            shard: 11/22
          - parte: teste-12
            shard: 12/22
          - parte: teste-13
            shard: 13/22
          - parte: teste-14
            shard: 14/22
          - parte: teste-15
            shard: 15/22
          - parte: teste-16
            shard: 16/22
          - parte: teste-17
            shard: 17/22
          - parte: teste-18
            shard: 18/22
          - parte: teste-19
            shard: 19/22
          - parte: teste-20
            shard: 20/22
          - parte: teste-21
            shard: 21/22
          - parte: teste-22
            shard: 22/22
          - parte: stick
            shard: ""
    steps:
      # C-37: no stored github.token header, otherwise git sends it instead of CYBER_GPU_TOKEN for cyber-gpu.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Spațiu pe disc (uneltele mari ale mașinii GitHub, nefolosite aici)
        # 2026-11-07: run 42391129170 had 97/97 scenarios green, then ran out of disk (93 MB left) building the stick image:
        # the cache restored the previous cyber-gpu revision's build files next to the new ones.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Unelte sistem (QEMU, OVMF, xorriso, unelte FAT)
        # Fail fast instead of hanging for an hour when the package mirrors stall (CI 284, 11 Nov 2026).
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # P6-167: run 45268598614 (stick) — the install was cut by the 300 s limit during the triggers ("dpkg was
          # interrupted"), and every retry then failed at once: skip man-db's slow trigger, finish dpkg before a retry.
          sudo rm -f /var/lib/man-db/auto-update || true
          for i in 1 2 3; do
            sudo dpkg --configure -a || true
            timeout 150 sudo -E apt-get update $APT_OPTS && \
            timeout 300 sudo -E apt-get install -y -qq $APT_OPTS \
              qemu-system-x86 ovmf xorriso dosfstools mtools fdisk && exit 0
            # CI 284/285: `apt-get update` hung even with a second Ubuntu mirror, so keep only the Ubuntu sources
            # (the runner's extra repositories are not needed here) and use the kernel.org mirror.
            echo "apt attempt $i failed; only Ubuntu sources from the kernel.org mirror, retrying in 15 s"
            sudo mkdir -p /etc/apt/oprite
            for f in /etc/apt/sources.list.d/*; do
              [ "$(basename "$f")" = ubuntu.sources ] || sudo mv "$f" /etc/apt/oprite/ 2>/dev/null || true
            done
            # CI 286: the runner's Ubuntu sources are `mirror+file:/etc/apt/apt-mirrors.txt` (azure.archive.ubuntu.com,
            # unreachable on 11 Nov 2026) — put the kernel.org mirror first in that list.
            printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E 's#https?://([a-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            grep -h '^URIs' /etc/apt/sources.list.d/*.sources 2>/dev/null || true; cat /etc/apt/apt-mirrors.txt
            sleep 15
          done
          exit 1

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal -c rust-src -t x86_64-unknown-none

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/target-test*
            build/limine-*
            crypto/target
            tls/target
            json/target
            rtl8168/target
            e1000e/target
          key: ${{ runner.os }}-cu2-${{ matrix.parte }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cu2-${{ matrix.parte }}-
            ${{ runner.os }}-cu2-

      - name: Verificare mediu
        run: tools/env-check.sh

      - name: Criptografie — vectorii oficiali pe gazdă (crypto/)
        if: matrix.parte == 'stick'
        run: cd crypto && cargo test --release

      - name: TLS 1.3 — clientul nostru față de un server OpenSSL pe gazdă și față de site-uri reale (tls/)
        if: matrix.parte == 'stick'
        run: cd tls && CYBER_NET=1 cargo test --release -- --nocapture

      - name: JSON — cititorul și scriitorul propriu, față de Python (json/)
        if: matrix.parte == 'stick'
        run: cd json && cargo test --release

      - name: Driver Realtek RTL8168 — față de modelul cipului, pe gazdă (rtl8168/)
        if: matrix.parte == 'stick'
        run: cd rtl8168 && cargo test --release
      - name: Driver Intel e1000/82574/I219 — față de modelul plăcii, pe gazdă (e1000e/)
        if: matrix.parte == 'stick'
        run: cd e1000e && cargo test --release

      - name: Acces la cyber-gpu (repo privat, B-005)
        env:
          CYBER_GPU_TOKEN: ${{ secrets.CYBER_GPU_TOKEN }}
        run: tools/ci-cyber-gpu-acces.sh

      - name: Build + test în QEMU, partea ${{ matrix.shard }} (cu scenariile care au nevoie de internet)
        if: matrix.shard != ''
        run: CYBER_NET=1 tools/test.sh --shard ${{ matrix.shard }}

      - name: Imagine pentru stick USB (docs/USB.md)
        if: matrix.parte == 'stick'
        run: tools/build.sh --usb

      # P6-40 (C-52): the test stick of the I6 window (`gpu i6 --scrie`), a separate kernel and image in the Release.
      - name: Stick-ul de test pentru fereastra I6 (gpu-scrie)
        if: matrix.parte == 'stick'
        run: tools/build.sh --gpu-scrie --usb

      - name: Imaginea pentru stick
        if: matrix.parte == 'stick'
        uses: actions/upload-artifact@v4
        with:
          name: stick-usb
          path: build/cyber-universe-usb.img
          if-no-files-found: error

      - name: Fișierele pentru Release (P6-07)
        if: matrix.parte == 'stick' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tools/release-files.sh

      - name: Fișierele pentru Release
        if: matrix.parte == 'stick' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release/
          if-no-files-found: error

      - name: Rezultate (log serial și captură de ecran)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezultate-test-${{ matrix.parte }}
          path: |
            build/serial-*.log
            build/build-*.log
            tests/screens/*.png
          if-no-files-found: ignore

  # P6-07: after green tests on main, a GitHub Release with the stick files (the newest is "latest"); the last 5 are kept.
  # Only this job may write to the repository.
  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # C-17: the list of kept Releases (hardware-tested or restore points) lives in docs/RELEASES_PASTRATE.md.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/RELEASES_PASTRATE.md
          sparse-checkout-cone-mode: false
          path: repo
      # C-16: os-187 = the restore point chosen by Adrian (stabil-2026-10-23: 9f67d7b + a test-only fix) is never deleted.
      - name: Release os-<număr> (marcat „latest”), păstrează ultimele 5 + cele din RELEASES_PASTRATE.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="os-${{ github.run_number }}"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
            --title "Cyber Universe OS $TAG" \
            --notes "Construit și testat de CI din commit-ul $GITHUB_SHA. Fișierele pentru stick: docs/USB.md (varianta B). Sumele: SHA256SUMS."
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^os-' | grep -vxF -e os-187 -f <(grep -oE '^\| *os-[0-9]+ *\|' repo/docs/RELEASES_PASTRATE.md | tr -d '| ') \
            | tail -n +6 | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
