name: Stress (5 minute)

# The 5-minute stability test (P1-11). Too long for every push: runs weekly (Monday, C-15) and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # C-37: no stored github.token header, otherwise git sends it instead of CYBER_GPU_TOKEN for cyber-gpu.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unelte sistem (QEMU, OVMF, xorriso, unelte FAT)
        # Fail fast instead of hanging for an hour when the package mirrors stall (CI 284, 11 Nov 2026).
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            timeout 150 sudo -E apt-get update $APT_OPTS && \
            timeout 300 sudo -E apt-get install -y -qq $APT_OPTS \
              qemu-system-x86 ovmf xorriso dosfstools mtools fdisk && exit 0
            # CI 284/285: `apt-get update` hung even with a second Ubuntu mirror, so keep only the Ubuntu sources
            # (the runner's extra repositories are not needed here) and use the kernel.org mirror.
            echo "apt attempt $i failed; only Ubuntu sources from the kernel.org mirror, retrying in 15 s"
            sudo mkdir -p /etc/apt/oprite
            for f in /etc/apt/sources.list.d/*; do
              [ "$(basename "$f")" = ubuntu.sources ] || sudo mv "$f" /etc/apt/oprite/ 2>/dev/null || true
            done
            # CI 286: the runner's Ubuntu sources are `mirror+file:/etc/apt/apt-mirrors.txt` (azure.archive.ubuntu.com,
            # unreachable on 11 Nov 2026) — put the kernel.org mirror first in that list.
            printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E 's#https?://([a-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            grep -h '^URIs' /etc/apt/sources.list.d/*.sources 2>/dev/null || true; cat /etc/apt/apt-mirrors.txt
            sleep 15
          done
          exit 1

      - name: Rust nightly
        run: rustup toolchain install nightly --profile minimal -c rust-src -t x86_64-unknown-none

      - name: Verificare mediu
        run: tools/env-check.sh

      - name: Acces la cyber-gpu (repo privat, B-005)
        env:
          CYBER_GPU_TOKEN: ${{ secrets.CYBER_GPU_TOKEN }}
        run: tools/ci-cyber-gpu-acces.sh

      - name: Test de stabilitate (5 minute în QEMU)
        run: tools/test.sh --stress

      - name: Rezultate (log serial)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezultate-stres
          path: |
            build/serial-*.log
            build/build-*.log
          if-no-files-found: ignore
